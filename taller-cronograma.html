<html lang="es">
<head>

<title>Cinco meses en una pared</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,900&display=swap">
<style>
:root{
  --paper:#E5DDD1; --paper-soft:#DCD3C3; --accent:#7B5B3E; --accent-deep:#6A4E35;
  --line:#CFC4B2; --text:#2E3226; --text-soft:#5E6350; --card-bg:#F4EFE6; --card-border:#D3C8B6;
  --stop:#9C4A32; --warn:#C68A3E; --go:#67704F; --info:#4A6670;
  --verde:#DCE5D4; --azul:#D6E1E6; --amarillo:#F3E6C4; --rojo:#F0D3C9;
  --shadow:0 18px 44px -26px rgba(46,50,38,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--text); font-family:Onest,system-ui,-apple-system,Segoe UI,sans-serif; font-size:16px; line-height:1.55; display:flex; flex-direction:column; min-height:100vh}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}
/* barra */
.topbar{display:flex; align-items:center; gap:14px; padding:11px 18px; border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:30}
.topbar .k{font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.15em; text-transform:uppercase; color:var(--accent-deep)}
.topbar h1{font-family:'Source Serif 4',Georgia,serif; font-weight:900; font-size:18px; margin:0; line-height:1.1; letter-spacing:-.01em}
.brand{display:flex; flex-direction:column; gap:1px; min-width:0}
.brand a{color:inherit; text-decoration:none}
.menu-btn{border:1px solid var(--card-border); background:var(--card-bg); border-radius:9px; width:40px; height:38px; cursor:pointer; display:grid; place-items:center; font-size:18px; color:var(--text)}
.prog{margin-left:auto; display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--text-soft); white-space:nowrap}
.prog .bar{width:120px; height:6px; border-radius:99px; background:var(--paper-soft); overflow:hidden}
.prog .bar i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s}
/* cuerpo */
.wrap{flex:1 1 auto; display:flex; min-height:0}
.indice{width:290px; flex:0 0 auto; border-right:1px solid var(--line); background:var(--card-bg); padding:14px 10px; overflow-y:auto; transition:margin .2s}
.indice.oculto{margin-left:-290px}
.indice h2{font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-soft); margin:8px 8px 6px}
.indice button{display:flex; gap:9px; align-items:flex-start; width:100%; text-align:left; border:0; background:transparent; padding:7px 9px; border-radius:9px; cursor:pointer; font:inherit; font-size:14px; color:var(--text); line-height:1.3}
.indice button:hover{background:var(--paper)}
.indice button.activo{background:var(--paper-soft); font-weight:600}
.indice button .pt{flex:0 0 auto; width:16px; height:16px; margin-top:2px; border-radius:99px; border:1.5px solid var(--card-border); display:grid; place-items:center; font-size:10px; color:#fff}
.indice button.visto .pt{background:var(--go); border-color:var(--go)}
.escena{flex:1 1 auto; min-width:0; overflow-y:auto; overflow-x:hidden; padding:26px 16px 40px; background:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/34px 34px, var(--paper)}
.tarj{max-width:920px; width:100%; margin:0 auto; min-width:0; background:var(--card-bg); border:1.5px solid var(--card-border); border-radius:16px; box-shadow:var(--shadow); padding:26px 30px 24px}
.tarj .cab{font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep); font-weight:600; margin-bottom:6px}
.tarj h2{font-family:'Source Serif 4',Georgia,serif; font-weight:900; font-size:27px; margin:0 0 12px; line-height:1.12; letter-spacing:-.012em; text-wrap:balance}
.tarj h3{font-family:'Source Serif 4',Georgia,serif; font-weight:600; font-size:19px; margin:20px 0 8px}
.tarj p{margin:0 0 10px}
.tarj ul, .tarj ol{margin:0 0 12px; padding-left:22px}
.tarj li{margin-bottom:5px}
.pie-nav{max-width:920px; margin:18px auto 0; display:flex; justify-content:space-between; align-items:center; gap:10px}
.btn{border:1px solid var(--card-border); background:var(--card-bg); color:var(--text); border-radius:9px; cursor:pointer; padding:9px 16px; font-size:14px; font-family:'IBM Plex Mono',monospace; transition:border-color .15s, background .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.btn.pri{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.pri:hover:not(:disabled){background:var(--accent-deep)}
.btn.peq{padding:5px 10px; font-size:12px}
.paso{font-family:'IBM Plex Mono',monospace; font-size:.74rem; color:var(--text-soft); letter-spacing:.05em}
/* piezas */
.chip{font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:99px; border:1px solid var(--card-border); color:var(--text-soft); display:inline-block}
.caja{border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; margin:10px 0; background:var(--paper)}
.caja.ok{border-color:var(--go); background:color-mix(in srgb,var(--go) 10%, var(--paper))}
.caja.mal{border-color:var(--stop); background:color-mix(in srgb,var(--stop) 9%, var(--paper))}
.caja.ojo{border-color:var(--warn); background:color-mix(in srgb,var(--warn) 12%, var(--paper))}
.caja.info{border-color:var(--info); background:color-mix(in srgb,var(--info) 9%, var(--paper))}
.caja .t{font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.13em; text-transform:uppercase; color:var(--text-soft); margin-bottom:5px; font-weight:600}
table{border-collapse:collapse; width:100%; font-size:13.5px; margin:8px 0 12px}
th,td{border:1px solid var(--card-border); padding:5px 7px; text-align:left; vertical-align:top}
th{background:var(--paper-soft); font-family:'IBM Plex Mono',monospace; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft)}
td.n{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}
tr.crit td{background:color-mix(in srgb,var(--stop) 12%, var(--card-bg))}
tr.verde td{background:var(--verde)} tr.azul td{background:var(--azul)} tr.amar td{background:var(--amarillo)} tr.hito td{background:var(--rojo)}
input[type=text], input[type=number], select, textarea{font:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--card-border); border-radius:8px; background:#fff; color:var(--text); max-width:100%}
input[type=number]{width:74px; font-family:'IBM Plex Mono',monospace}
input.celda{width:54px; padding:3px 4px; text-align:center; font-family:'IBM Plex Mono',monospace}
input.celda.mal{border-color:var(--stop); background:color-mix(in srgb,var(--stop) 14%, #fff)}
input.celda.ok{border-color:var(--go); background:color-mix(in srgb,var(--go) 14%, #fff)}
input.pred{width:150px; font-family:'IBM Plex Mono',monospace}
textarea{width:100%; min-height:80px}
label.f{display:block; margin:10px 0 4px; font-weight:600; font-size:14px}
.fila{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:8px 0}
.dos{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:760px){ .dos{grid-template-columns:1fr} .indice{position:absolute; z-index:25; height:calc(100% - 61px); box-shadow:var(--shadow)} .tarj{padding:18px 14px} .tarj h2{font-size:22px} .prog .bar{display:none} .escena{padding:16px 10px 40px} }
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:8px 0 12px}
.tw table{margin:0; min-width:520px}
.flip{perspective:900px; cursor:pointer; min-height:120px}
.flip .cara{border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; background:var(--paper); transition:transform .4s; transform-style:preserve-3d; position:relative; min-height:120px}
.flip .cara .b{position:absolute; inset:0; padding:12px 14px; backface-visibility:hidden; transform:rotateY(180deg); background:color-mix(in srgb,var(--info) 12%, var(--paper)); border-radius:12px}
.flip .cara .a{backface-visibility:hidden}
.flip.volteada .cara{transform:rotateY(180deg)}
.flip .t{font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.13em; text-transform:uppercase; color:var(--text-soft); margin-bottom:5px; font-weight:600}
.tarjeta-ev{border:1.5px solid var(--card-border); border-radius:12px; padding:12px 14px; background:var(--paper); cursor:pointer; transition:border-color .15s}
.tarjeta-ev.sel{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%, var(--paper))}
.tarjeta-ev h4{margin:0 0 6px; font-family:'Source Serif 4',Georgia,serif; font-size:17px}
.tarjeta-ev p{font-size:13.5px; margin:0; color:var(--text-soft)}
.opc{display:block; width:100%; text-align:left; border:1px solid var(--card-border); background:var(--paper); border-radius:10px; padding:9px 12px; margin:6px 0; cursor:pointer; font:inherit; font-size:14.5px; color:var(--text)}
.opc:hover{border-color:var(--accent)}
.opc.ok{border-color:var(--go); background:color-mix(in srgb,var(--go) 14%, var(--paper))}
.opc.mal{border-color:var(--stop); background:color-mix(in srgb,var(--stop) 12%, var(--paper))}
.par{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.ficha{border:1px solid var(--card-border); border-radius:10px; padding:8px 10px; background:var(--paper); cursor:pointer; font-size:13.5px; min-height:48px}
.ficha.sel{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%, var(--paper))}
.ficha.hecha{border-color:var(--go); background:color-mix(in srgb,var(--go) 14%, var(--paper)); cursor:default}
.red{overflow:auto; border:1px solid var(--card-border); border-radius:12px; background:#fff; margin:8px 0}
.red svg{display:block}
.leyenda{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--text-soft); margin:4px 0 10px}
.leyenda i{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid var(--card-border)}
.sobre{border:2px dashed var(--accent); border-radius:14px; padding:14px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:.8rem; color:var(--accent-deep); background:var(--paper)}
.sello{display:inline-block; border:2px solid var(--stop); color:var(--stop); border-radius:6px; padding:2px 8px; transform:rotate(-6deg); font-weight:600; letter-spacing:.1em}
.oculto{display:none !important}
.pequeno{font-size:13px; color:var(--text-soft)}
.pie{border-top:1px solid var(--line); padding:9px 18px; font-family:'IBM Plex Mono',monospace; font-size:.66rem; color:var(--text-soft); letter-spacing:.05em; display:flex; gap:18px; flex-wrap:wrap}
@media print{ .topbar,.indice,.pie-nav,.pie,.menu-btn{display:none !important} .escena{overflow:visible; background:#fff; padding:0} .tarj{box-shadow:none; border:0} }
</style>
</head>

/* ============================================================ calendario */
const DIA = 86400000;
function fechaIdx(i){ return new Date(INICIO.getTime() + i*DIA); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esLaboral(i){ const d = fechaIdx(i); const w = d.getDay(); return w!==0 && w!==6 && !FESTIVOS.includes(iso(d)); }
function rodar(i){ while(!esLaboral(i)) i++; return i; }
function sumarHabiles(i, n){ // devuelve el índice del día siguiente al último día trabajado
  i = rodar(i); if(n===0) return i;
  let k = 0; while(true){ if(esLaboral(i)) { k++; if(k===n) return i+1; } i++; }
}
function habilK(k){ // fecha del día hábil k contado desde el inicio (k=0 es el 1 de marzo)
  let i = 0, c = 0; i = rodar(0); while(c<k){ i++; i = rodar(i); c++; } return i;
}
const fLarga = new Intl.DateTimeFormat('es-CO',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
function fmt(d){ return fLarga.format(d).replace(/^\w/, c=>c.toUpperCase()); }
function fmtIdx(i){ return fmt(fechaIdx(i)); }
function num(x){ return String(x).replace('.', ','); }

/* ============================================================ CPM */
function parsePreds(txt){ // "A2, A3+2, A17SS+2" -> [{id,tipo,lag}]
  const out = [], errs = [];
  (txt||'').split(/[,;\s]+/).filter(Boolean).forEach(tok=>{
    const m = tok.toUpperCase().match(/^(A\d+)(FS|SS)?(?:\+(\d+))?$/);
    if(!m || !(m[1] in IDX)) errs.push(tok); else out.push({id:m[1], tipo:m[2]||'FS', lag:+(m[3]||0)});
  });
  return {preds:out, errs};
}
function orden(logica){ // orden topológico; null si hay ciclo
  const vis = {}, temp = {}, res = [];
  function dfs(id){ if(temp[id]) return false; if(vis[id]) return true; temp[id]=true;
    for(const p of (logica[id]||[])) if(!dfs(p.id)) return false; temp[id]=false; vis[id]=true; res.push(id); return true; }
  for(const a of ACT) if(!dfs(a.id)) return null;
  return res;
}
function cpm(logica, opt={}){ // opt: dur{id:n}, mas{id:n}, restr{id:k}
  const dur = {}; ACT.forEach(a=>{ dur[a.id] = (opt.dur&&a.id in opt.dur)?opt.dur[a.id]:a.d; if(opt.mas&&a.id in opt.mas) dur[a.id]+=opt.mas[a.id]; });
  const restr = {}; ACT.forEach(a=>{ if(a.restr) restr[a.id]=a.restr; }); if(opt.restr) Object.assign(restr, opt.restr);
  const ord = orden(logica); if(!ord) return null;
  const ES={}, EF={}, LS={}, LF={};
  for(const id of ord){ let es=0; for(const p of (logica[id]||[])) es = Math.max(es, p.tipo==='SS' ? ES[p.id]+p.lag : EF[p.id]+p.lag);
    if(id in restr) es = Math.max(es, restr[id]); ES[id]=es; EF[id]=es+dur[id]; }
  const fin = Math.max(...Object.values(EF));
  for(const id of [...ord].reverse()){ let lf = fin;
    for(const s of ACT){ for(const p of (logica[s.id]||[])) if(p.id===id){ lf = Math.min(lf, p.tipo==='SS' ? LS[s.id]-p.lag+dur[id] : LS[s.id]-p.lag); } }
    LF[id]=lf; LS[id]=lf-dur[id]; }
  const H = {}; ACT.forEach(a=>H[a.id]=LS[a.id]-ES[a.id]);
  const rc = ACT.filter(a=>H[a.id]===0 && a.id!=='A24' && a.id!=='A1').map(a=>a.id);
  return {ES,EF,LS,LF,H,dur,fin,recibo:EF['A23'],rc};
}
// paso adelante con fechas reales: curados en días transcurridos y restricción como fecha
function fechas(logica, opt={}){
  const dur = {}; ACT.forEach(a=>{ dur[a.id] = (opt.dur&&a.id in opt.dur)?opt.dur[a.id]:a.d; if(opt.mas&&a.id in opt.mas) dur[a.id]+=opt.mas[a.id]; });
  const restr = {}; ACT.forEach(a=>{ if(a.restr) restr[a.id]=habilK(a.restr); }); if(opt.restr) for(const k in opt.restr) restr[k]=habilK(opt.restr[k]);
  const ord = orden(logica); if(!ord) return null;
  const ini={}, fin={};
  for(const id of ord){ const a = ACT[IDX[id]]; let s = 0;
    for(const p of (logica[id]||[])){ const base = p.tipo==='SS' ? ini[p.id] : fin[p.id]; s = Math.max(s, p.lag ? sumarHabiles(rodar(base), p.lag) : base); }
    if(id in restr) s = Math.max(s, restr[id]); s = rodar(s); ini[id]=s;
    fin[id] = a.tipo==='dt' ? s + 7 : (dur[id]===0 ? s : sumarHabiles(s, dur[id])); }
  return {ini, fin, recibo: fin['A22']-1 >= ini['A22'] ? fin['A22']-1 : ini['A22']};
}

function dibujarRed(L, r){

  const W=150, Hh=64, bw=126, bh=48; const nCols = Object.keys(cols).length; const maxRows = Math.max(...Object.values(cols).map(c=>c.length));
  const pos = {}; Object.keys(cols).forEach(k=>{ cols[k].forEach((id,j)=>{ pos[id] = {x: 24 + k*W, y: 24 + j*Hh}; }); });
  const fill = {verde:'#DCE5D4', azul:'#D6E1E6', amar:'#F3E6C4', hito:'#F0D3C9'};
  const CR = new Set(r.rc.concat(r.H['A1']===0?['A1']:[]));
  let s = `<svg width="${24+nCols*W+20}" height="${24+maxRows*Hh+20}" viewBox="0 0 ${24+nCols*W+20} ${24+maxRows*Hh+20}" font-family="IBM Plex Mono, monospace"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a8479"/></marker><marker id="flc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9C4A32"/></marker></defs>`;
  for(const id of ord) for(const p of (L[id]||[])){ const a=pos[p.id], b=pos[id]; if(!a||!b) continue; const crit = CR.has(id) && CR.has(p.id) && (p.tipo==='SS' ? r.ES[id]===r.ES[p.id]+p.lag : r.ES[id]===r.EF[p.id]+p.lag);
    s += `<path d="M${a.x+bw} ${a.y+bh/2} C ${a.x+bw+30} ${a.y+bh/2}, ${b.x-30} ${b.y+bh/2}, ${b.x} ${b.y+bh/2}" fill="none" stroke="${crit?'#9C4A32':'#8a8479'}" stroke-width="${crit?2.4:1.2}" marker-end="url(#${crit?'flc':'fl'})" ${p.tipo==='SS'?'stroke-dasharray="4 3"':''}/>`; }
  for(const id of ord){ const a = ACT[IDX[id]], q = pos[id]; const crit = CR.has(id);
    s += `<g><rect x="${q.x}" y="${q.y}" width="${bw}" height="${bh}" rx="7" fill="${fill[filaClase(a)]}" stroke="${crit?'#9C4A32':'#B9AE9B'}" stroke-width="${crit?2.5:1}"/><text x="${q.x+7}" y="${q.y+15}" font-size="11" font-weight="600" fill="#2E3226">${id} <tspan font-weight="400" fill="#5E6350">${r.dur[id]}d</tspan></text><text x="${q.x+7}" y="${q.y+29}" font-size="9.5" fill="#2E3226">${esc(a.c.length>22?a.c.slice(0,21)+'…':a.c)}</text><text x="${q.x+7}" y="${q.y+42}" font-size="9.5" fill="#5E6350">${r.ES[id]}·${r.EF[id]}  H ${r.H[id]}</text></g>`; }
  return s + '</svg>';
}

/* ============================================================ render */
function render(){
  const id = SLIDES[cur]; if(!S.visto.includes(id)) { S.visto.push(id); guardar(); }
  location.hash = id;
  const esc_ = document.getElementById('escena');
  esc_.innerHTML = `<div class="tarj" id="tarj">${V[id]()}</div><div class="pie-nav"><button class="btn" id="ant" ${cur===0?'disabled':''}>← Anterior</button><span class="paso">${cur+1} · ${SLIDES.length} · ${TIT[id]}</span><button class="btn pri" id="sig" ${cur===SLIDES.length-1?'disabled':''}>Siguiente →</button></div>`;
  esc_.querySelectorAll('.tarj table').forEach(t=>{ const w=document.createElement('div'); w.className='tw'; t.parentNode.insertBefore(w,t); w.appendChild(t); });
  esc_.scrollTop = 0;
  document.getElementById('ant').onclick = ()=>{ cur--; render(); };
  document.getElementById('sig').onclick = ()=>{ cur++; render(); };
  const pct = Math.round(S.visto.length/SLIDES.length*100); document.getElementById('pct').textContent = pct+' %'; document.getElementById('barra').style.width = pct+'%';
  renderIndice(); enganchar(id);
}
function renderIndice(){
  const n = document.getElementById('indice'); let html = '';
  SEC.forEach(sec=>{ html += `<h2>${sec.t}</h2>`; sec.s.forEach(id=>{ const i = SLIDES.indexOf(id); html += `<button class="${i===cur?'activo':''} ${S.visto.includes(id)?'visto':''}" data-go="${i}"><span class="pt">${S.visto.includes(id)?'✓':''}</span><span>${TIT[id]}</span></button>`; }); });
  n.innerHTML = html; n.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ cur=+b.dataset.go; render(); if(window.innerWidth<760) n.classList.add('oculto'); });
}
function enganchar(id){
  const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
  if(id==='portada'){ $('#grupo').oninput = e=>{ S.grupo=e.target.value; guardar(); }; }
  if(id==='apuesta' && !S.sellado){ $('#sellar').onclick = ()=>{ const sem=$('#ap-sem').value, manda=$('#ap-manda').value, margen=$('#ap-margen').value; if(!sem||!manda||margen===''){ alert('Faltan datos en el sobre.'); return; } if(!confirm('¿Sellar el sobre? Después no se puede cambiar.')) return; S.apuesta={sem,manda,margen}; S.sellado=true; guardar(); render(); }; }
  if(id==='edt'){ $('#p14').oninput = e=>{S.edt.p14=e.target.value; guardar();}; $('#p15').oninput = e=>{S.edt.p15=e.target.value; guardar();};
    $('#edt-check').onclick = ()=>{ const out=[]; for(const [k,t] of [['1.4',S.edt.p14],['1.5',S.edt.p15]]){ const lineas = t.split('\n').map(x=>x.trim()).filter(Boolean); if(lineas.length<2) out.push(`<div class="caja mal">Rama ${k}: hacen falta al menos dos paquetes (una rama con un solo hijo no se descompone).</div>`); const verbos = lineas.filter(l=>/^\s*(\d+(\.\d+)*\s*)?(fundir|montar|pintar|construir|instalar|excavar|fabricar|transportar|comprar|hacer|colocar|armar|ejecutar|realizar)\b/i.test(l)); if(verbos.length) out.push(`<div class="caja ojo">Rama ${k}: hay paquetes escritos como actividad (verbo): ${verbos.map(esc).join(' · ')}. Un paquete es un sustantivo que se recibe: «estructura fabricada», «tablero», «acceso izquierdo».</div>`); if(lineas.length>=2 && !verbos.length) out.push(`<div class="caja ok">Rama ${k}: ${lineas.length} paquetes, en sustantivo. Ahora comprueben la regla del 100 por ciento colgando las actividades en la pantalla siguiente.</div>`); } $('#edt-out').innerHTML = out.join(''); }; }
  if(id==='colgar'){ $$('[data-colgar]').forEach(s=>s.onchange=e=>{ S.colgar[e.target.dataset.colgar]=e.target.value; guardar(); });
    $('#colgar-check').onclick = ()=>{ let ok=0, mal=[], vacio=0; ACT.forEach(a=>{ const v=S.colgar[a.id]; if(!v) vacio++; else if(v===a.rama) ok++; else mal.push(a.id); }); $('#colgar-out').innerHTML = `<div class="caja ${mal.length||vacio?'ojo':'ok'}">${ok} bien colgadas · ${mal.length} en otra rama${mal.length?` (${mal.join(', ')})`:''} · ${vacio} sin rama.${mal.includes('A25')?' Ojo con A25: la socialización es gestión social, y eso es gerencia del proyecto.':''}${mal.includes('A8')?' El permiso de la CAR es un preliminar del contrato, aunque lo tramite la entidad.':''}${mal.includes('A24')?' La liquidación es gerencia, no entrega.':''}</div>`; }; }
  if(id==='hitos'){ $('#hito4').oninput=e=>{S.hito4=e.target.value; guardar();}; $('#hito-check').onclick=()=>{ const t=S.hito4.trim(); const bueno=/(montad|curad|estructura en obra|estribos? terminad|tablero|prueba de carga|acceso|entrega parcial|acta parcial)/i.test(t); const verbo=/^(terminar|montar|comprar|fundir|hacer)/i.test(t); $('#hito-out').innerHTML = !t?'<div class="caja ojo">Escriban el hito.</div>':verbo?'<div class="caja mal">Está escrito como actividad. Un hito es un estado: «estructura montada», no «montar la estructura».</div>':bueno?'<div class="caja ok">Sirve: es un estado verificable que le importa al cliente o a la interventoría.</div>':'<div class="caja ojo">Puede servir. Pregúntense: ¿alguien lo firma o lo fotografía? ¿Coincide con un pago o con un cambio de fase?</div>'; }; }
  if(id==='logica'){ $$('[data-pred]').forEach(i=>i.oninput=e=>{ S.logica[e.target.dataset.pred]=e.target.value; guardar(); });
    $('#logica-check').onclick = ()=>{ const out=[]; const L={}; let errs=[]; ACT.forEach(a=>{ const p=parsePreds(S.logica[a.id]||''); L[a.id]=p.preds; if(p.errs.length) errs.push(a.id+': '+p.errs.join(' ')); });
      if(errs.length) out.push(`<div class="caja mal">No entiendo estas predecesoras: ${errs.map(esc).join(' · ')}</div>`);
      if(!orden(L)) out.push('<div class="caja mal">La red se muerde la cola: hay un ciclo. Ninguna actividad puede depender, directa o indirectamente, de sí misma.</div>');
      const sinPred = ACT.filter(a=>a.id!=='A1' && !L[a.id].length).map(a=>a.id); if(sinPred.length) out.push(`<div class="caja ojo">Sin predecesora: ${sinPred.join(', ')}. Toda actividad, salvo el acta de inicio, se conecta al menos a una anterior.</div>`);
      // hechos: se admite dependencia indirecta (a través de otras)
      function llega(desde, hasta, vis={}){ if(desde===hasta) return true; if(vis[desde]) return false; vis[desde]=true; return (L[desde]||[]).some(p=>llega(p.id,hasta,vis)); }
      const viol = HECHOS.filter(([a,p])=>!llega(a,p)).map(([a,p,why])=>`<li><b>${a}</b> debería venir después de <b>${p}</b>: ${why}.</li>`);
      if(viol.length) out.push(`<div class="caja mal"><div class="t">Hechos del catálogo que su lógica no respeta</div><ul>${viol.join('')}</ul></div>`);
      const dis = (L['A20']||[]).some(p=>p.id==='A19'); out.push(`<div class="caja info">${dis?'Marcaron el acceso derecho después del izquierdo: dependencia discrecional por la cuadrilla única. Anótenla en la bitácora como tal.':'Los dos accesos quedaron en paralelo: eso exige dos cuadrillas. Si es lo que quieren, hay que justificarlo y costarlo en la bitácora.'}</div>`);
      if(!errs.length && orden(L) && !sinPred.length && !viol.length) out.push('<div class="caja ok">La lógica respeta los hechos de la obra y la red cierra. Pasen al recorrido de ida y vuelta.</div>');
      $('#logica-out').innerHTML = out.join(''); }; }
  if(id==='idavuelta'){ $$('[data-cel]').forEach(i=>i.oninput=e=>{ const [a,k]=e.target.dataset.cel.split(':'); S.pared[a]=S.pared[a]||{}; S.pared[a][k]=e.target.value; guardar(); });
    const comprobar = (revelar)=>{ const r = cpm(logicaActual()); let mal=0, vac=0; $$('[data-cel]').forEach(i=>{ const [a,k]=i.dataset.cel.split(':'); const v=i.value.trim(); i.classList.remove('ok','mal'); if(revelar){ i.value=r[k][a]; S.pared[a]=S.pared[a]||{}; S.pared[a][k]=r[k][a]; return; } if(v===''){ vac++; return; } if(+v===r[k][a]) i.classList.add('ok'); else { i.classList.add('mal'); mal++; } }); if(revelar){ S.revelado=true; guardar(); $('#pared-res').textContent='Solución cargada. Queda anotado en la bitácora.'; return; } $('#pared-res').textContent = `${mal} celdas no cuadran · ${vac} vacías`; $('#pared-out').innerHTML = mal===0&&vac===0?`<div class="caja ok">Todo cuadra con su lógica. Recibo en el día hábil ${r.recibo}; ruta crítica ${r.rc.join(' → ')}.</div>`:`<div class="caja ojo">Revisen primero las celdas rojas de ES y EF, porque los errores de ida se arrastran a la vuelta. Pista: la holgura de una actividad nunca es menor que la de la cadena a la que pertenece.</div>`; };
    $('#pared-check').onclick=()=>comprobar(false); $('#pared-rev').onclick=()=>{ if(confirm('Esto escribe la solución de su lógica en la tabla y queda anotado en la bitácora. Úsenlo solo después de haber intentado. ¿Seguir?')) comprobar(true); }; }
  if(id==='pert'){ $$('[data-pert]').forEach(i=>i.oninput=e=>{ S.pert[e.target.dataset.pert]=e.target.value; guardar(); });
    $('#pert-check').onclick=()=>{ Object.keys(PERT).forEach(k=>{ const [o,m,p]=PERT[k]; const te=(o+4*m+p)/6, sg=(p-o)/6; const a=+S.pert[k+':te'], b=+S.pert[k+':sg']; $('#pert-'+k).innerHTML = (Math.abs(a-te)<0.06?'t<sub>e</sub> ✓':`t<sub>e</sub> no cuadra`)+' · '+(Math.abs(b-sg)<0.06?'σ ✓':'σ no cuadra'); }); };
    $('#pert-aplicar').onclick=()=>{ const L=logicaActual(); const b=cpm(L); const dur={}; Object.keys(PERT).forEach(k=>{ const [o,m,p]=PERT[k]; dur[k]=(o+4*m+p)/6; }); const r=cpm(L,{dur}); $('#pert-out').innerHTML=`<div class="caja info">Con las duraciones esperadas el recibo pasa del día ${b.recibo} al ${num(Math.round(r.recibo*10)/10)}. Ruta crítica ${r.rc.join()===b.rc.join()?'igual':'distinta'}: ${r.rc.join(' → ')}.<br>Para la bitácora: ¿cuáles de las tres inciertas están en la ruta crítica? Solo esas mueven la fecha; las otras consumen holgura.</div>`; }; }
  if(id==='hoja'){ $$('[data-check]').forEach(c=>c.onchange=e=>{ const i=+e.target.dataset.check; S.project.checks = S.project.checks||[]; if(e.target.checked){ if(!S.project.checks.includes(i)) S.project.checks.push(i);} else S.project.checks=S.project.checks.filter(x=>x!==i); guardar(); }); }
  if(id==='cotejo'){ $('#fecha-pj').onchange=e=>{ S.project.fecha=e.target.value; guardar(); };
    $('#cotejar').onclick=()=>{ const L=logicaActual(); const F=fechas(L); const r=cpm(L); const v=$('#fecha-pj').value; if(!v){ $('#cotejo-out').innerHTML='<div class="caja ojo">Escriban la fecha que dio Project.</div>'; return; } const [y,m,d]=v.split('-').map(Number); const dif = Math.round((new Date(y,m-1,d) - fechaIdx(F.recibo))/DIA);
      const fest = FESTIVOS.filter(f=>{ const [a,b,c]=f.split('-').map(Number); const t=new Date(a,b-1,c); return t>=INICIO && t<=fechaIdx(F.recibo) && t.getDay()>0 && t.getDay()<6; }).length;
      $('#cotejo-out').innerHTML = `<div class="caja ${dif===0?'ok':'ojo'}"><div class="t">Resultado</div>Con su lógica, calendario colombiano, curados en días transcurridos y la restricción de la CAR como fecha, el recibo debería caer el <b>${fmtIdx(F.recibo)}</b>. Project dijo ${fmt(new Date(y,m-1,d))}: ${dif===0?'cuadra.':`<b>${Math.abs(dif)} días calendario de diferencia</b> (${dif>0?'Project más tarde':'Project más temprano'}).`}<br><span class="pequeno">En ese tramo hay ${fest} festivos entre semana. La pared decía día hábil ${r.recibo}. Si la diferencia no se explica con festivos, curados en dt o la restricción de fecha, revisen las predecesoras en Project una por una.</span></div>`; }; }
  if(id==='tarjetas'){ $$('[data-ev]').forEach(c=>c.onclick=()=>{ const e=c.dataset.ev; if(S.ev.aplic.length){ alert('Ya aplicaron tarjetas; para cambiarlas hay que borrar el bloque 4.'); return; } if(S.ev.sel.includes(e)) S.ev.sel=S.ev.sel.filter(x=>x!==e); else if(S.ev.sel.length<2) S.ev.sel.push(e); guardar(); render(); });
    $('#sortear').onclick=()=>{ if(S.ev.aplic.length) return; const ids=EVENTOS.map(e=>e.id); S.ev.sel=[]; while(S.ev.sel.length<2){ const x=ids[Math.floor(Math.random()*ids.length)]; if(!S.ev.sel.includes(x)) S.ev.sel.push(x); } guardar(); render(); }; }
  if(id==='aplicar'){ $$('[data-predtxt]').forEach(t=>t.oninput=e=>{ S.ev.pred[e.target.dataset.predtxt]=e.target.value; guardar(); });
    $$('[data-aplicar]').forEach(b=>b.onclick=()=>{ const e=b.dataset.aplicar; if((S.ev.pred[e]||'').trim().length<40){ alert('Primero la predicción, por escrito y con alguna cifra. Sin apuesta no hay corrección.'); return; } const k = S.ev.sel.indexOf(e); if(k===1 && !S.ev.aplic.includes(S.ev.sel[0])){ alert('La segunda tarjeta se aplica sobre el resultado de la primera.'); return; } S.ev.aplic.push(e); guardar(); render(); });
    $$('[data-comp]').forEach(c=>c.onchange=e=>{ S.ev.comp=S.ev.comp||[]; const v=e.target.dataset.comp; if(e.target.checked){ if(!S.ev.comp.includes(v)) S.ev.comp.push(v);} else S.ev.comp=S.ev.comp.filter(x=>x!==v); guardar(); render(); });
    $$('[data-dec]').forEach(t=>t.oninput=e=>{ S.ev.dec=S.ev.dec||{}; S.ev.dec[e.target.dataset.dec]=e.target.value; guardar(); }); }
  if(id==='sobre'){ $('#cierre').oninput=e=>{ S.cierre=e.target.value; guardar(); }; }
  if(id==='quiz'){ $$('[data-q]').forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.q.split(':').map(Number); if(S.quiz[i]!==undefined) return; S.quiz[i]=j; guardar(); render(); }); }
  if(id==='emparejar'){ $$('[data-par]').forEach(f=>f.onclick=()=>{ if(f.classList.contains('hecha')) return; const [lado,i]=f.dataset.par.split(':'); if(!parSel){ parSel={lado,i,el:f}; f.classList.add('sel'); return; } if(parSel.lado===lado){ parSel.el.classList.remove('sel'); parSel={lado,i,el:f}; f.classList.add('sel'); return; } if(parSel.i===i){ S.pares=S.pares||[]; S.pares.push(+i); guardar(); parSel=null; render(); } else { f.classList.add('mal'); setTimeout(()=>{ f.classList.remove('mal'); parSel.el.classList.remove('sel'); parSel=null; }, 500); } }); }
  if(id==='bitacora'){ const txt = bitacora(); $('#bit-prev').textContent = txt; $('#descargar').onclick=()=>{ const b=new Blob([txt],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`Bitacora taller 1 - ${(S.grupo||'grupo').replace(/[^\w ]/g,'')}.txt`; a.click(); }; $('#imprimir').onclick=()=>window.print(); $('#borrar').onclick=()=>{ if(confirm('¿Borrar todo el avance de este navegador?')){ try{ localStorage.removeItem(KEY); }catch(e){} location.hash=''; location.reload(); } }; }
}
function bitacora(){
  const L=logicaActual(); const r=cpm(L); const F=r?fechas(L):null; const a=S.apuesta;
  const li=[]; li.push('BITÁCORA DE DECISIONES · TALLER 1 · CINCO MESES EN UNA PARED'); li.push('Grupo: '+(S.grupo||'(sin nombre)')+' · Generada: '+new Date().toLocaleString('es-CO')); li.push('');
  li.push('1. APUESTA (sobre): '+(S.sellado?`${a.sem} semanas · manda: ${a.manda} · margen ${a.margen} días hábiles`:'no se selló')); li.push('');
  li.push('2. EDT · rama 1.4:'); li.push((S.edt.p14||'(vacío)')); li.push('   rama 1.5:'); li.push((S.edt.p15||'(vacío)')); li.push('   cuarto hito: '+(S.hito4||'(vacío)')); li.push('');
  li.push('3. LÓGICA (predecesoras):'); ACT.forEach(x=>li.push(`   ${x.id} ${x.c}: ${S.logica[x.id]||'ninguna'}`)); li.push('   Dependencias discrecionales y justificación: (completar)'); li.push('');
  if(r){ li.push(`4. RUTA CRÍTICA A MANO: ${r.rc.join(' > ')}`); li.push(`   Recibo en el día hábil ${r.recibo}. Holgura de la cadena de concreto (A12): ${r.H['A12']} días. Holgura de accesos (A20): ${r.H['A20']} días.`); }
  else li.push('4. RUTA CRÍTICA: la red no cierra (ciclo).'); if(S.revelado) li.push('   (La página reveló la solución de ida y vuelta para esta lógica.)'); li.push('');
  li.push('5. PERT: '+Object.keys(PERT).map(k=>`${k} te=${S.pert[k+':te']||'?'} σ=${S.pert[k+':sg']||'?'}`).join(' · ')); li.push('   ¿Cambia la ruta crítica con las esperadas? (completar)'); li.push('');
  li.push(`6. COTEJO: fecha esperada con calendario ${F?fmtIdx(F.recibo):'?'} · fecha de Project ${S.project.fecha||'(no registrada)'} · explicación día por día: (completar)`); li.push('');
  li.push('7. EVENTOS:'); S.ev.sel.forEach(id=>{ const e=EVENTOS.find(x=>x.id===id); li.push(`   ${e.id} ${e.t}`); li.push('   Predicción: '+(S.ev.pred[id]||'(vacía)')); li.push('   Decisión: '+((S.ev.dec||{})[id]||(e.ap.meta?'compresión escogida: '+((S.ev.comp||[]).map(c=>COMPRESION.find(x=>x.id===c).t).join('; ')||'ninguna'):'(vacía)'))); }); li.push('');
  li.push('8. CIERRE: '+(S.cierre||'(vacío)')); li.push('');
  li.push('9. PREGUNTAS DE CIERRE: '+QUIZ.map((q,i)=>S.quiz[i]===undefined?'sin responder':(S.quiz[i]===q.c?'bien':'mal')).join(' · '));
  return li.join('\n');
}
document.getElementById('menu').onclick=()=>document.getElementById('indice').classList.toggle('oculto');
if(window.innerWidth<760) document.getElementById('indice').classList.add('oculto');
window.addEventListener('hashchange', ()=>{ const i = SLIDES.indexOf(location.hash.slice(1)); if(i>=0 && i!==cur){ cur=i; render(); } });
render();
</script>
